apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ping-out-pong-ing
  namespace: exercises
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: log-output-svc 
            port:
              number: 2323
      - path: /pingpong
        pathType: Prefix
        backend:
          service:
            name: ping-pong-svc
            port:
              number: 2323 
