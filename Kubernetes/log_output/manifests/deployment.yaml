apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: vol-reader
          persistentVolumeClaim:
            claimName: lab-claim 
      containers:
        - name: log-reader
          image: leandrocfg/log_reader:2.1 
          env:
            - name: PINGPONG_URL
              value: "http://ping-pong-svc:2323/pings" 
          volumeMounts:
            - name: vol-reader
              mountPath: /usr/src/app/files/
        - name: log-write
          image: leandrocfg/log_write:1.10
          volumeMounts:
            - name: vol-reader
              mountPath: /usr/src/app/files/
