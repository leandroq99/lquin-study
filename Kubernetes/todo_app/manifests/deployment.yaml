apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: todo-volume
          emptyDir: {}
      containers:
        - name: todo-app
          image: leandrocfg/todo-app:2.2
          volumeMounts:
            - name: todo-volume
              mountPath: /usr/src/app/files
          env:
            - name: PORT
              value: "5000"
